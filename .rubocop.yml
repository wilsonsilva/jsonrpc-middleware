plugins:
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rake
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  DisplayCopNames: true
  NewCops: enable

# ----------------------- Gemspec -----------------------

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

# ----------------------- Style -----------------------

Style/OneClassPerFile:
  Exclude:
    - examples/**/config.ru

Style/MixinUsage:
  Exclude:
    - bin/console

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

# ----------------------- Layout ----------------------

Layout/LineLength:
  Max: 120
  Exclude:
    - jsonrpc-middleware.gemspec

# ---------------------- Metrics ----------------------

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Enabled: false

# ----------------------- Rails -----------------------

Rails/Delegate:
  Exclude:
    - lib/jsonrpc/batch_request.rb # Not using Rails
    - lib/jsonrpc/notification.rb # Not using Rails

# This gem is not a Rails application, so the :environment task is not required.
Rails/RakeEnvironment:
  Enabled: false

# All specs use Rack::Test::Methods, not ActionDispatch integration helpers.
# The cop only applies to the ActionDispatch positional API and gives false
# positives for rack-test's post(uri, params, env) signature.
Rails/HttpPositionalArguments:
  Enabled: false

# ----------------------- RSpec -----------------------

RSpec/ExampleLength:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

# RuboCop does not like the gem's name.
RSpec/SpecFilePathFormat:
  Enabled: false
